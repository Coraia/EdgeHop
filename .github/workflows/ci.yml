name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal tools)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Validate scripts and installer
        run: |
          bash -n scripts/*.sh
          ./scripts/setup-omarchy-test.sh
          plutil -lint scripts/Info.plist
      - name: Build Linux clients
        run: make build-client
